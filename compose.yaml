services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: soskate
      MYSQL_USER: soskate
      MYSQL_PASSWORD: soskate
      MYSQL_ROOT_PASSWORD: soskate
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usoskate", "-psoskate" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data: