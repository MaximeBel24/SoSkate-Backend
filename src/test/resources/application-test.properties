# Flyway builds the schema on an empty database; Hibernate only checks that it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

soskate.security.jwt-secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMTIzNDU2Nzg5MA==
soskate.security.jwt-expiration=3600000

logging.level.root=WARN
logging.level.com.soskate.api=WARN
logging.level.org.hibernate.SQL=WARN

# Fake AWS credentials (the S3 client is never called in tests)
aws.access-key-id=test-access-key
aws.secret-access-key=test-secret-key