# =================================
# Base de données H2 en mémoire
# =================================
# "mem:soskate_test" = base en mémoire, détruite après chaque run
# MODE=MYSQL = H2 simule le comportement MySQL
spring.datasource.url=jdbc:h2:mem:soskate_test;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =================================
# JPA : créer les tables automatiquement
# =================================
# En prod tu utilises "validate" (Flyway gère le schéma)
# En test on utilise "create-drop" : crée les tables au démarrage, les supprime à la fin
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# =================================
# Désactiver Flyway en test
# =================================
# Flyway est pour la prod. En test, Hibernate gère le schéma via create-drop
spring.flyway.enabled=false

# =================================
# JWT config de test (valeurs fixes, pas besoin de .env)
# =================================
soskate.security.jwt-secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMTIzNDU2Nzg5MA==
soskate.security.jwt-expiration=3600000

# =================================
# Désactiver ce qui n'est pas nécessaire en test
# =================================
spring.main.allow-bean-definition-overriding=true
logging.level.root=WARN
logging.level.com.soskate.api=DEBUG