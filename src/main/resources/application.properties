# =================================
# Configuration de base Spring Boot
# =================================
spring.application.name=api
server.servlet.context-path=/api

# =================================
# Configuration Base de donnees
# =================================
spring.datasource.url=jdbc:mysql://localhost:3306/soskate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=COURSDB
spring.datasource.password=COURSDB

# =================================
# Configuration JPA/Hibernate
# =================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.generate_statistics=false

# =================================
# Configuration gestion d'erreurs
# =================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# =================================
# Configuration OpenAPI/Swagger
# =================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Debug SpringDoc
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG

# =================================
# Configuration des logs
# =================================
logging.level.root=INFO
logging.level.com.soskate.api=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.output.ansi.enabled=ALWAYS

# =================================
# Configuration Jackson (JSON)
# =================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# =================================
# Configuration validation
# =================================
spring.mvc.problemdetails.enabled=true

# =================================
# Configuration performance
# =================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# =================================
# Configuration developpement
# =================================
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false

# =================================
# Configuration monitoring
# =================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true